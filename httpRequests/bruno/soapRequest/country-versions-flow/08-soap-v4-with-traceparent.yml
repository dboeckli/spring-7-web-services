info:
  name: "8) SOAP V4 with traceparent (Camel-CXF: /cxf/countriesV4 into direct:get-country)"
  type: http
  seq: 8

http:
  method: POST
  url: http://localhost:{{application-port}}/cxf/countriesV4
  headers:
    - name: Content-Type
      value: text/xml; charset=utf-8
    - name: SOAPAction
      value: '""'
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-01
    - name: baggage
      value: testBaggage=hallo
  body:
    type: text
    data: |-
      <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                        xmlns:gs="https://spring.io/guides/gs-producing-web-service">
          <soapenv:Header/>
          <soapenv:Body>
              <gs:getCountryRequestV4>
                  <gs:name>Spain</gs:name>
              </gs:getCountryRequestV4>
          </soapenv:Body>
      </soapenv:Envelope>
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("traceId")) {
            throw new Error("traceId is not set - run step 2 first");
        }
        const hex = (length) => Array.from({ length: length },
            () => "0123456789abcdef"[Math.floor(Math.random() * 16)]).join("");
        bru.setVar("spanId", hex(16));
    - type: tests
      code: |-
        const body = String(res.body);
        test("returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("returns the V4 response", function () {
            expect(/<([\w-]+:)?getCountryResponseV4[\s>]/.test(body), "getCountryResponseV4 missing").to.be.true;
            expect(/<([\w-]+:)?name>Spain</.test(body), "name=Spain missing").to.be.true;
            expect(/<([\w-]+:)?capital>Madrid</.test(body), "capital=Madrid missing").to.be.true;
            expect(/<([\w-]+:)?currency>EUR</.test(body), "currency=EUR missing").to.be.true;
        });
        test("preserves the incoming traceId in the response traceparent", function () {
            const traceparent = res.getHeader("traceparent");
            expect(!!traceparent, "traceparent response header missing").to.be.true;
            expect(traceparent.startsWith("00-" + bru.getVar("traceId") + "-"), "response traceparent does not carry the incoming traceId: " + traceparent).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

