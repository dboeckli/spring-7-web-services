info:
  name: "6) SOAP V3 with traceparent (Camel spring-ws: entry point into direct:get-country)"
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:{{application-port}}/services
  headers:
    - name: Content-Type
      value: text/xml; charset=utf-8
    - name: SOAPAction
      value: '""'
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-01
    - name: baggage
      value: testBaggage=hallo
  body:
    type: text
    data: |-
      <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                        xmlns:gs="https://spring.io/guides/gs-producing-web-service">
          <soapenv:Header/>
          <soapenv:Body>
              <gs:getCountryRequestV3>
                  <gs:name>Spain</gs:name>
              </gs:getCountryRequestV3>
          </soapenv:Body>
      </soapenv:Envelope>
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("traceId")) {
            throw new Error("traceId is not set - run step 2 first");
        }
        const hex = (length) => Array.from({ length: length },
            () => "0123456789abcdef"[Math.floor(Math.random() * 16)]).join("");
        bru.setVar("spanId", hex(16));
    - type: tests
      code: |-
        const traceId = bru.getVar("traceId");
        const body = String(res.body);
        test("returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("returns the V3 response", function () {
            expect(/<([\w-]+:)?getCountryResponseV3[\s>]/.test(body), "getCountryResponseV3 missing").to.be.true;
            expect(/<([\w-]+:)?name>Spain</.test(body), "name=Spain missing").to.be.true;
            expect(/<([\w-]+:)?currency>EUR</.test(body), "currency=EUR missing").to.be.true;
        });
        test("echoes traceparent and baggage in the SOAP header", function () {
            expect(body.includes('traceparent="00-' + traceId + "-"), "SOAP header traceparent does not carry the incoming traceId").to.be.true;
            expect(body.includes('baggage="'), "SOAP header baggage missing").to.be.true;
        });
        test("does not overwrite the incoming traceparent", function () {
            expect(!res.getHeader("traceparent"), "unexpected response traceparent").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

