info:
  name: 1) actuator health (precondition)
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:{{application-port}}/actuator/health
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("health returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("health status is UP", function () {
            expect(res.body.status === "UP", "status=" + res.body.status).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
