info:
  name: 7) SOAP V3 without traceparent (server creates a new trace)
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:{{application-port}}/services
  headers:
    - name: Content-Type
      value: text/xml; charset=utf-8
    - name: SOAPAction
      value: '""'
    - name: baggage
      value: testBaggage=hallo
  body:
    type: text
    data: |-
      <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                        xmlns:gs="https://spring.io/guides/gs-producing-web-service">
          <soapenv:Header/>
          <soapenv:Body>
              <gs:getCountryRequestV3>
                  <gs:name>Spain</gs:name>
              </gs:getCountryRequestV3>
          </soapenv:Body>
      </soapenv:Envelope>
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("returns the V3 response", function () {
            expect(/<([\w-]+:)?name>Spain</.test(String(res.body)), "name=Spain missing").to.be.true;
        });
        test("server generates a traceparent response header", function () {
            const traceparent = res.getHeader("traceparent");
            expect(!!traceparent, "traceparent response header missing").to.be.true;
            expect(/^00-[0-9a-f]{32}-[0-9a-f]{16}-01$/.test(traceparent), "unexpected traceparent: " + traceparent).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

