info:
  name: 8) verify the recorded V1/V2/V3 exchanges (actuator/httpexchanges) — requires steps 2, 4 and 6
  type: http
  seq: 8

http:
  method: GET
  url: http://localhost:{{application-port}}/actuator/httpexchanges
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("traceId")) {
            throw new Error("traceId is not set - run step 2 first");
        }
    - type: tests
      code: |-
        const traceId = bru.getVar("traceId");
        test("returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("records one /services exchange per variant for the shared traceId", function () {
            const matches = (res.body.exchanges || []).filter(function (exchange) {
                const uri = exchange.request && exchange.request.uri ? exchange.request.uri : "";
                return uri.includes("/services") && JSON.stringify(exchange.request.headers || {}).includes(traceId);
            });
            expect(matches.length === 3, "expected 3 exchanges for the traceId but got " + matches.length).to.be.true;
            matches.forEach(function (exchange) {
                expect(String(exchange.response.status) === "200", "unexpected status " + exchange.response.status).to.be.true;
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

