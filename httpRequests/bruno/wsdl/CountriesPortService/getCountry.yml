    data: <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body><getCountryRequest xmlns="https://spring.io/guides/gs-producing-web-service"><name>string</name></getCountryRequest></soap:Body></soap:Envelope>

runtime:
