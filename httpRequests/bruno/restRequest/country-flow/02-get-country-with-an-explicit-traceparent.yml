info:
  name: 2) get country with an explicit traceparent (continues the incoming trace)
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:{{application-port}}/api/countries/Spain
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-01
    - name: baggage
      value: testBaggage=hallo
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        function randomHex(length) {
            let result = "";
            const chars = "0123456789abcdef";
            for (let i = 0; i < length; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            return result;
        }

        bru.setVar("traceId", randomHex(32));
        bru.setVar("spanId", randomHex(16));
        console.log("continuing trace " + bru.getVar("traceId"));
    - type: tests
      code: |-
        test("returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("returns Spain", function () {
            expect(res.body.name === "Spain", "name=" + res.body.name).to.be.true;
            expect(res.body.capital === "Madrid", "capital=" + res.body.capital).to.be.true;
            expect(res.body.currency === "EUR", "currency=" + res.body.currency).to.be.true;
            expect(res.body.population === 46704314, "population=" + res.body.population).to.be.true;
        });
        test("does not overwrite the incoming traceparent", function () {
            const traceparent = res.getHeader("traceparent");
            expect(!traceparent, "unexpected response traceparent: " + traceparent).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

