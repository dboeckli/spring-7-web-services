info:
  name: 3) get country without traceparent (server creates a new trace)
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:{{application-port}}/api/countries/Spain
  headers:
    - name: Accept
      value: application/json
    - name: baggage
      value: testBaggage=hallo
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("returns Spain", function () {
            expect(res.body.name === "Spain", "name=" + res.body.name).to.be.true;
            expect(res.body.currency === "EUR", "currency=" + res.body.currency).to.be.true;
        });
        test("server generates a traceparent response header", function () {
            const traceparent = res.getHeader("traceparent");
            expect(!!traceparent, "traceparent response header missing").to.be.true;
            expect(/^00-[0-9a-f]{32}-[0-9a-f]{16}-01$/.test(traceparent), "unexpected traceparent: " + traceparent).to.be.true;
            bru.setVar("generatedTraceparent", traceparent);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

