      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const traceId = bru.getVar("traceId");
        console.log("verify exchange -> traceId: " + traceId);
        if (!traceId) {
            throw new Error("traceId is not set - run step 2 first");
        }
    - type: tests
      code: |-
        const traceId = bru.getVar("traceId");
        test("returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("records the Spain request with the propagated traceparent", function () {
            const exchanges = res.body.exchanges || [];
            const match = exchanges.find(function (exchange) {
                const uri = exchange.request && exchange.request.uri ? exchange.request.uri : "";
                return uri.includes("/api/countries/Spain")
                    && JSON.stringify(exchange.request.headers || {}).includes(traceId);
            });
            expect(!!match, "no recorded exchange for /api/countries/Spain with traceId " + traceId).to.be.true;
            expect(String(match.response.status) === "200", "status=" + match.response.status).to.be.true;
        });

