info:
  name: 6) prometheus counter for the REST endpoint (optional sanity check)
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:{{application-port}}/actuator/metrics/http.server.requests
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("exposes measured http.server.requests", function () {
            const availableTags = res.body.availableTags || [];
            const uriTag = availableTags.find(function (tag) {
                return tag.tag === "uri";
            });
            expect(!!uriTag, "uri tag missing").to.be.true;
            expect(uriTag.values.some(function (value) {
                return value.includes("/api/countries");
            }), "no /api/countries uri tag: " + JSON.stringify(uriTag.values)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

