---
server:
  port: 8080
spring:
  application:
    name: "spring-7-web-services"
  docker:
    compose:
      enabled: true
      stop:
        command: "down"
      skip:
        in-tests: true
  webservices:
    wsdl-locations: "classpath:META-INF/schemas/"
camel:
  opentelemetry2:
    enabled: true
    traceProcessors: true
  health:
    enabled: true
    routes-enabled: true
    consumers-enabled: true
    producers-enabled: true
management:
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoints:
    access:
      default: "unrestricted"
    web:
      exposure:
        include: "*"
  endpoint:
    configprops:
      show-values: "ALWAYS"
    health:
      probes:
        enabled: true
      show-details: "always"
    camelroutes:
      read-only: true
      access: "unrestricted"
  info:
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      enabled: true
      mode: "full"
  httpexchanges:
    recording:
      enabled: true
      include: "request_headers, response_headers, session_id, time_taken"
  observations:
    annotations:
      enabled: true
    http:
      server:
        requests:
          name: "http.server.requests"
      client:
        requests:
          name: "http-client-requests"
  otlp:
    metrics:
      export:
        enabled: true
        url: "http://localhost:4318/v1/metrics"
        step: "10s"
  tracing:
    export:
      otlp:
        enabled: true
      enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: W3C
      consume: W3C
      produce: W3C
    baggage:
      enabled: true
      # Specify which baggage fields should be propagated to downstream services
      remote-fields: # Erlaubt das Empfangen des Headers "baggage: test1=..."
        - testBaggage
        - addedBaggage
      tag-fields: # KOPIERT den Wert aus dem Baggage in die Span-Labels (Attributes)
        - testBaggage
        - addedBaggage
      correlation:
        fields: # Also make baggage available in MDC for logging
          - testBaggage
          - addedBaggage
        enabled: true
  logging:
    export:
      enabled: true
      otlp:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.namespace: "spring-7-web-services"
      deployment.environment: "local"
    logging:
      export:
        otlp:
          endpoint: "http://localhost:4318/v1/logs"
    tracing:
      export:
        otlp:
          endpoint: "http://localhost:4318/v1/traces"

appconfig:
  request-logging:
    # set to false to remove the request logging filter from the chain entirely
    enabled: true
    # request URI prefixes that are not logged
    exclude-paths:
      - /actuator/health

logging:
  level:
    ch.dboeckli.soap.service.log.RequestLoggingFilter: "DEBUG"
    io.micrometer.tracing: DEBUG
    io.opentelemetry: DEBUG